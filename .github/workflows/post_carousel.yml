name: Post Carousel

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instaliraj font (DejaVu, podržava č/ć/š/ž/đ)
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Instaliraj Pillow i Google Drive biblioteke
        run: pip install Pillow google-api-python-client google-auth google-auth-httplib2

      - name: Proveri da li je ciljani termin za Carousel (PRIVREMENO smanjeno na 4x dnevno dok nalog "ne stekne poverenje" kod Instagrama) - ručno pokretanje uvek prolazi
        id: time_check
        run: |
          python -c "
          from zoneinfo import ZoneInfo
          from datetime import datetime
          import os
          TARGET_HOURS = [11, 15, 19, 23]
          event_name = os.environ.get('GITHUB_EVENT_NAME', '')
          if event_name == 'workflow_dispatch':
              ok = True
              print('Ručno pokretanje - preskačem proveru sata.')
          else:
              hour = datetime.now(ZoneInfo('Europe/Belgrade')).hour
              ok = hour in TARGET_HOURS
              print(f'Trenutni sat po srpskom vremenu: {hour}, ciljani termin: {ok}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'ok={str(ok).lower()}\n')
          "

      - name: Zauzmi katanac
        id: lock
        if: steps.time_check.outputs.ok == 'true'
        run: python scripts/lock_utils.py acquire carousel

      - name: Proveri Instagram kvotu
        id: quota
        if: steps.lock.outputs.acquired == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/check_quota.py

      - name: Generiši slike za carousel
        if: steps.lock.outputs.acquired == 'true' && steps.quota.outputs.ok == 'true'
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/generate_and_host_carousel.py

      - name: Objavi carousel na Instagram
        if: steps.lock.outputs.acquired == 'true' && steps.quota.outputs.ok == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/publish_carousel.py

      - name: Otključaj katanac
        if: always() && steps.lock.outputs.acquired == 'true'
        run: python scripts/lock_utils.py release carousel
